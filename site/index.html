<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EasyETFs Tracker</title>
<meta name="description" content="Daily NAV, premium/discount, holdings changes and look-through exposure for the EasyETFs actively managed funds.">
<style>
:root {
  color-scheme: light;
  --bg: #f4f4f2; --surface: #fcfcfb; --surface-2: #f0f0ed; --border: #e0dfdb; --grid: #e9e8e4;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #7d7b76;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --pos: #0a7a4f; --neg: #c62f2e; --pos-bg: #e3f4ec; --neg-bg: #fbe7e7; --warn-bg: #fdf1d6; --warn: #8a5b00; --info-bg: #e5eefb;
  --shadow: 0 1px 2px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #111110; --surface: #1a1a19; --surface-2: #232321; --border: #33322f; --grid: #2a2926;
    --text: #ffffff; --text-2: #c3c2b7; --text-3: #8f8e85;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --pos: #3fcf9c; --neg: #f27b7a; --pos-bg: #12291f; --neg-bg: #33191a; --warn-bg: #33290f; --warn: #e6b34d; --info-bg: #172234;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px 48px; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; padding: 22px 0 12px; }
header.top h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
header.top .sub { color: var(--text-2); }
.fresh { margin-left: auto; font-size: 12px; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pos); display: inline-block; }
.dot.stale { background: var(--s4); }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--border); margin-bottom: 18px; position: sticky; top: 0; background: var(--bg); z-index: 5; padding-top: 4px; }
nav.tabs a { padding: 10px 14px; text-decoration: none; color: var(--text-2); border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 600; }
nav.tabs a small { font-weight: 400; color: var(--text-3); margin-left: 4px; }
nav.tabs a.on { color: var(--text); border-color: var(--s1); }
h2 { font-size: 15px; margin: 0 0 2px; }
.hint { color: var(--text-3); font-size: 12px; margin: 0 0 10px; }
.grid { display: grid; gap: 14px; }
.g3 { grid-template-columns: repeat(3, 1fr); }
.g2 { grid-template-columns: repeat(2, 1fr); }
.g21 { grid-template-columns: 2fr 1fr; }
@media (max-width: 900px) { .g3, .g2, .g21 { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow); min-width: 0; }
.mt { margin-top: 14px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.spread { justify-content: space-between; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.kpi .l { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; }
.kpi .v { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 2px; }
.kpi .s { font-size: 11px; color: var(--text-3); }
.pos { color: var(--pos); } .neg { color: var(--neg); } .muted { color: var(--text-3); }
.pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; background: var(--surface-2); color: var(--text-2); white-space: nowrap; }
.pill.pos { background: var(--pos-bg); color: var(--pos); } .pill.neg { background: var(--neg-bg); color: var(--neg); }
.pill.warn { background: var(--warn-bg); color: var(--warn); } .pill.info { background: var(--info-bg); color: var(--s1); }
.fundcard { text-decoration: none; color: inherit; display: block; }
.fundcard:hover { border-color: var(--s1); }
.fundcard .nm { font-weight: 650; }
.fundcard .full { font-size: 11px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fundcard .big { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; margin: 6px 0 2px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
.chip { font-size: 12px; background: var(--surface-2); border-radius: 6px; padding: 2px 7px; font-variant-numeric: tabular-nums; }
.chip b { font-weight: 500; color: var(--text-3); margin-right: 4px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { background: var(--surface); color: var(--text-2); border: 0; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button.on { background: var(--s1); color: #fff; }
input[type=search], select { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; }
input[type=search] { min-width: 200px; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--text-3); font-size: 11px; font-family: inherit; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.18); white-space: nowrap; z-index: 4; display: none; }
.tip .d { color: var(--text-3); margin-bottom: 2px; }
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--text-2); margin: 6px 0 0; }
.legend button { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.legend button.off { opacity: .4; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-3); font-weight: 600; cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--surface); }
th.on { color: var(--text); }
th:first-child, td:first-child { text-align: left; }
td.txt, th.txt { text-align: left; }
tr:hover td { background: var(--surface-2); }
.wbar { position: relative; min-width: 90px; }
.wbar span { position: absolute; left: 0; top: 4px; bottom: 4px; background: var(--s1); opacity: .18; border-radius: 3px; }
.wbar b { position: relative; font-weight: 600; }
.stack { display: flex; height: 14px; border-radius: 4px; overflow: hidden; gap: 2px; background: var(--surface-2); }
.stack div { min-width: 2px; }
.split { display: flex; justify-content: space-between; font-size: 12px; padding: 2px 0; }
.insights { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.insights li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; background: var(--surface-2); border-radius: 8px; }
.insights .ic { font-size: 15px; line-height: 1.3; }
.feed { display: grid; gap: 0; }
.feed .it { display: grid; grid-template-columns: 62px 84px 1fr auto; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); align-items: center; }
.feed .it:last-child { border: 0; }
@media (max-width: 560px) { .feed .it { grid-template-columns: 54px 78px 1fr; } .feed .it .r { display: none; } }
.bar2 { display: grid; grid-template-columns: 1fr 70px; align-items: center; gap: 8px; font-size: 12px; padding: 3px 0; }
.bar2 .track { position: relative; height: 10px; background: var(--surface-2); border-radius: 3px; }
.bar2 .fill { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.foot { color: var(--text-3); font-size: 12px; margin-top: 22px; }
.err { padding: 40px; text-align: center; color: var(--text-2); }
a { color: var(--s1); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>EasyETFs Tracker</h1>
    <span class="sub">NAV, premium/discount, holdings moves &amp; look-through exposure</span>
    <span class="fresh" id="fresh"></span>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"><div class="err">Loading…</div></main>
  <p class="foot" id="foot"></p>
</div>
<script>
"use strict";
let D = null;
const state = { range: "3M", table: { key: "weight", dir: -1, q: "", kind: "all" }, hidden: {}, evtype: "all" };
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const CAT = ["--s1", "--s2", "--s3", "--s4", "--s5", "--s6", "--s7", "--s8"];

/* ---------- formatting ---------- */
const isN = v => typeof v === "number" && isFinite(v);
const sign = v => (v > 0 ? "+" : v < 0 ? "−" : "");
const cls = v => (!isN(v) || Math.abs(v) < 0.005 ? "" : v > 0 ? "pos" : "neg");
const arrow = v => (!isN(v) || Math.abs(v) < 0.005 ? "" : v > 0 ? "▲" : "▼");
const pct = (v, d = 2) => (isN(v) ? `${sign(v)}${Math.abs(v).toFixed(d)}%` : "–");
const pp = (v, d = 2) => (isN(v) ? `${sign(v)}${Math.abs(v).toFixed(d)}pp` : "–");
const num = (v, d = 2) => (isN(v) ? v.toLocaleString("en-ZA", { minimumFractionDigits: d, maximumFractionDigits: d }).replace(/ /g, " ") : "–");
const rand = zac => (isN(zac) ? "R" + num(zac / 100, 2) : "–");
const delta = (v, f = pct) => `<span class="${cls(v)}">${arrow(v)} ${f(v)}</span>`.replace("> ", ">");
const fdate = (s, y = false) => { if (!s) return "–"; const d = new Date(s + (s.length === 10 ? "T00:00:00Z" : "")); return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", ...(y ? { year: "numeric" } : {}), timeZone: "UTC" }); };
const ago = iso => { const m = (Date.now() - new Date(iso)) / 60000; return m < 60 ? `${Math.round(m)}m ago` : m < 2880 ? `${Math.round(m / 60)}h ago` : `${Math.round(m / 1440)}d ago`; };
const title = n => String(n).toLowerCase().replace(/\b([a-z])/g, c => c.toUpperCase()).replace(/\bEtf\b/, "ETF").replace(/\bInav\b/, "iNAV");

/* ---------- charts ---------- */
function niceTicks(lo, hi, n = 5) {
  const span = hi - lo || 1, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || raw;
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}
const ms = d => Date.parse(d + "T00:00:00Z");
function cutRange(points, range, last) {
  if (range === "ALL" || !points.length) return points;
  const days = { "1M": 31, "3M": 92, "6M": 183 }[range] || 92;
  const end = last || ms(points[points.length - 1][0]);
  return points.filter(p => ms(p[0]) >= end - days * 864e5);
}
function attachHover(el, svgW, plot, getRows, drawX) {
  const svg = $("svg", el), tip = $(".tip", el), cross = $(".cross", el);
  const move = e => {
    const r = svg.getBoundingClientRect(), x = ((e.touches ? e.touches[0].clientX : e.clientX) - r.left) * (svgW / r.width);
    const rows = getRows(x); if (!rows) return;
    cross.setAttribute("x1", rows.x); cross.setAttribute("x2", rows.x); cross.style.display = "";
    tip.innerHTML = `<div class="d">${fdate(rows.date, true)}</div>` + rows.items.map(i => `<div>${i.color ? `<i style="background:${i.color}"></i>` : ""}${esc(i.label)}: <b>${esc(i.value)}</b></div>`).join("");
    tip.style.display = "block";
    const scale = r.width / svgW, tw = tip.offsetWidth;
    let left = rows.x * scale + 12; if (left + tw > r.width) left = rows.x * scale - tw - 12;
    tip.style.left = Math.max(0, left) + "px"; tip.style.top = "6px";
  };
  const leave = () => { tip.style.display = "none"; cross.style.display = "none"; };
  svg.addEventListener("mousemove", move); svg.addEventListener("touchmove", move, { passive: true });
  svg.addEventListener("mouseleave", leave); svg.addEventListener("touchend", leave);
}
function lineChart(el, o) {
  const W = Math.max(320, el.clientWidth || 640), H = o.height || 250, m = { l: o.left || 48, r: 10, t: 8, b: 22 };
  const all = o.series.flatMap(s => s.points);
  if (!all.length) { el.innerHTML = `<div class="hint">No data yet.</div>`; return; }
  const xs = all.map(p => ms(p[0])), x0 = Math.min(...xs), x1 = Math.max(...xs);
  let ys = all.map(p => p[1]), lo = Math.min(...ys), hi = Math.max(...ys);
  if (o.includeZero) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  const padY = (hi - lo) * 0.08 || 1; lo -= padY; hi += padY;
  const X = t => m.l + ((t - x0) / (x1 - x0 || 1)) * (W - m.l - m.r), Y = v => H - m.b - ((v - lo) / (hi - lo)) * (H - m.t - m.b);
  const yt = niceTicks(lo, hi, 5), grid = css("--grid");
  let g = yt.map(v => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${grid}"/><text x="${m.l - 6}" y="${Y(v) + 4}" text-anchor="end">${o.yFmt ? o.yFmt(v) : v}</text>`).join("");
  const nx = W < 500 ? 4 : 7;
  for (let i = 0; i <= nx; i++) { const t = x0 + ((x1 - x0) * i) / nx; g += `<text x="${X(t)}" y="${H - 5}" text-anchor="${i === 0 ? "start" : i === nx ? "end" : "middle"}">${fdate(new Date(t).toISOString().slice(0, 10))}</text>`; }
  if (o.base != null) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(o.base)}" y2="${Y(o.base)}" stroke="${css("--text-3")}" stroke-dasharray="3 3"/>`;
  const paths = o.series.map(s => `<path d="${s.points.map((p, i) => (i ? "L" : "M") + X(ms(p[0])).toFixed(1) + " " + Y(p[1]).toFixed(1)).join("")}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"${s.dash ? ` stroke-dasharray="${s.dash}"` : ""}/>`).join("");
  const ends = o.series.filter(s => s.points.length).map(s => { const p = s.points[s.points.length - 1]; return `<circle cx="${X(ms(p[0]))}" cy="${Y(p[1])}" r="3.5" fill="${s.color}" stroke="${css("--surface")}" stroke-width="2"/>`; }).join("");
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || "chart")}">${g}${paths}${ends}<line class="cross" y1="${m.t}" y2="${H - m.b}" stroke="${css("--text-3")}" style="display:none"/><rect x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H}" fill="transparent"/></svg><div class="tip"></div>`;
  attachHover(el, W, m, x => {
    const t = x0 + ((x - m.l) / (W - m.l - m.r)) * (x1 - x0);
    let best = null;
    const items = o.series.map(s => { if (!s.points.length) return null; let b = s.points[0]; for (const p of s.points) if (Math.abs(ms(p[0]) - t) < Math.abs(ms(b[0]) - t)) b = p; if (!best || Math.abs(ms(b[0]) - t) < Math.abs(ms(best[0]) - t)) best = b; return { s, b }; }).filter(Boolean);
    if (!best) return null;
    return { x: X(ms(best[0])), date: best[0], items: items.filter(i => i.b[0] === best[0] || Math.abs(ms(i.b[0]) - ms(best[0])) < 4 * 864e5).map(i => ({ color: i.s.color, label: i.s.name, value: o.tipFmt ? o.tipFmt(i.b[1]) : num(i.b[1]) })) };
  });
}
function barChart(el, o) {
  const pts = o.points, W = Math.max(320, el.clientWidth || 640), H = o.height || 170, m = { l: 44, r: 10, t: 8, b: 22 };
  if (!pts.length) { el.innerHTML = `<div class="hint">No data yet.</div>`; return; }
  const vals = pts.map(p => p[1]); let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals); const pad = (hi - lo) * 0.08 || 1; if (lo < 0) lo -= pad; hi += pad;
  const Y = v => H - m.b - ((v - lo) / (hi - lo)) * (H - m.t - m.b), pw = (W - m.l - m.r) / pts.length, bw = Math.max(1, pw - (pw > 4 ? 2 : 0.5));
  let g = niceTicks(lo, hi, 4).map(v => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v === 0 ? css("--text-3") : css("--grid")}"/><text x="${m.l - 6}" y="${Y(v) + 4}" text-anchor="end">${o.yFmt ? o.yFmt(v) : v}</text>`).join("");
  const xl = [0, Math.floor(pts.length / 2), pts.length - 1];
  g += xl.map((i, k) => `<text x="${m.l + pw * i + pw / 2}" y="${H - 5}" text-anchor="${k === 0 ? "start" : k === 2 ? "end" : "middle"}">${fdate(pts[i][0])}</text>`).join("");
  const pos = o.pos || css("--s1"), neg = o.neg || css("--s2");
  const bars = pts.map((p, i) => { const y0 = Y(0), y1 = Y(p[1]), top = Math.min(y0, y1), h = Math.max(1, Math.abs(y0 - y1)); return `<rect x="${m.l + pw * i + (pw - bw) / 2}" y="${top}" width="${bw}" height="${h}" rx="${bw > 5 ? 2 : 0}" fill="${p[1] >= 0 ? pos : neg}"/>`; }).join("");
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || "chart")}">${g}${bars}<line class="cross" y1="${m.t}" y2="${H - m.b}" stroke="${css("--text-3")}" style="display:none"/><rect x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H}" fill="transparent"/></svg><div class="tip"></div>`;
  attachHover(el, W, m, x => { const i = Math.max(0, Math.min(pts.length - 1, Math.floor((x - m.l) / pw))); const p = pts[i]; return { x: m.l + pw * i + pw / 2, date: p[0], items: [{ label: o.name, value: o.tipFmt(p[1]) }] }; });
}
function spark(vals, w = 90, h = 24, color = "var(--s1)") {
  const v = vals.filter(isN); if (v.length < 2) return "";
  const lo = Math.min(...v), hi = Math.max(...v), r = hi - lo || 1;
  const pts = v.map((y, i) => `${((i / (v.length - 1)) * (w - 4) + 2).toFixed(1)},${(h - 3 - ((y - lo) / r) * (h - 6)).toFixed(1)}`).join(" ");
  const last = pts.split(" ").pop().split(",");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="2.4" fill="${color}"/></svg>`;
}
const rangeSeg = () => `<div class="seg" role="group" aria-label="Range">${["1M", "3M", "6M", "ALL"].map(r => `<button data-range="${r}" class="${state.range === r ? "on" : ""}">${r}</button>`).join("")}</div>`;

/* ---------- derived helpers ---------- */
const fund = code => D.funds.find(f => f.code === code);
const lastDate = D_ => D_.funds.map(f => f.snapshot_date).filter(Boolean).sort().pop();
function recentEvents(days, funds = D.funds) {
  const cutoff = ms(lastDate(D)) - days * 864e5, out = [];
  funds.forEach(f => f.events.forEach(e => { if (ms(e.date) >= cutoff) out.push({ ...e, fund: f.code }); }));
  return out.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : Math.abs(b.delta) - Math.abs(a.delta)));
}
function insights() {
  const out = [], F = D.funds;
  F.forEach(f => {
    const p = f.premium;
    if (p && isN(p.percentile) && (p.percentile <= 10 || p.percentile >= 90) && p.observations > 20)
      out.push(["⚖️", `<b>${f.code}</b> is at a <b>${pct(p.current_pct)}</b> ${p.current_pct < 0 ? "discount" : "premium"} to NAV — more extreme than ${p.percentile <= 10 ? 100 - p.percentile : p.percentile}% of its history (avg ${pct(p.mean_pct)}). ${p.current_pct < 0 ? "Buying below NAV has historically been cheap here." : "You'd be paying more than usual over NAV."}`, p.current_pct < 0 ? "pos" : "warn"]);
  });
  const by7 = F.filter(f => isN(f.nav_returns.d7)).sort((a, b) => b.nav_returns.d7 - a.nav_returns.d7);
  if (by7.length > 1) out.push(["📈", `Best 7-day NAV move: <b>${by7[0].code}</b> ${pct(by7[0].nav_returns.d7)}; weakest: <b>${by7[by7.length - 1].code}</b> ${pct(by7[by7.length - 1].nav_returns.d7)}.`, ""]);
  F.forEach(f => { const r = f.risk; if (r && isN(r.current_drawdown_pct) && r.current_drawdown_pct < -10) out.push(["📉", `<b>${f.code}</b> is ${pct(r.current_drawdown_pct, 1)} below its high of ${rand(r.high)} (${fdate(r.high_date)}); worst drawdown so far ${pct(r.max_drawdown_pct, 1)}.`, ""]); });
  const ev = recentEvents(7);
  const added = ev.filter(e => e.type === "added"), exited = ev.filter(e => e.type === "exited");
  if (added.length || exited.length) out.push(["🔁", `Last 7 days: ${added.length} new position${added.length === 1 ? "" : "s"}${added.length ? " (" + [...new Set(added.map(e => title(e.instrument) + " · " + e.fund))].slice(0, 3).join(", ") + ")" : ""}, ${exited.length} exit${exited.length === 1 ? "" : "s"}${exited.length ? " (" + [...new Set(exited.map(e => title(e.instrument) + " · " + e.fund))].slice(0, 3).join(", ") + ")" : ""}.`, "info"]);
  const lt = D.overview.look_through;
  if (lt && lt.buckets) { const off = lt.buckets["Offshore equity"]; out.push(["🧩", `Look-through, <b>EASYBF</b> is really <b>${num(off, 0)}%</b> offshore equities, ${num(lt.buckets["SA equity"], 0)}% SA equities and ${num(lt.buckets["Funds & bonds (direct)"], 0)}% funds/bonds — its 2 sleeves alone are ${num(lt.sleeves.reduce((a, s) => a + s.weight, 0), 0)}% of the fund.`, ""]); }
  const ov = D.overview.overlap; if (ov && ov.shared_count) out.push(["🔗", `EASYGE and EASYAI share <b>${ov.shared_count}</b> stocks with <b>${num(ov.overlap_pct, 1)}%</b> weighted overlap — holding both is less diversified than it looks.`, ""]);
  const top = F.map(f => ({ f, h: f.holdings.filter(h => h.kind === "equity" && isN(h.chg_7d)).sort((a, b) => Math.abs(b.chg_7d) - Math.abs(a.chg_7d))[0] })).filter(x => x.h && Math.abs(x.h.chg_7d) >= 0.3);
  top.forEach(({ f, h }) => out.push(["🎯", `<b>${f.code}</b>'s biggest 7-day shift: <b>${title(h.instrument)}</b> ${pp(h.chg_7d)} to ${num(h.weight)}%.`, ""]));
  return out.slice(0, 9);
}

  const ser = wh.series.slice(0, 8).map((s, i) => ({ name: title(s.instrument), color: css(CAT[i]), off: hid[s.instrument], key: s.instrument, points: idx.map(k => [wh.dates[k], s.weights[k]]) }));
  lineChart($("#whist"), { series: ser.filter(s => !s.off), height: 280, yFmt: v => v.toFixed(0) + "%", tipFmt: v => num(v) + "%", label: "Weight history" });
  $("#whistLegend").innerHTML = ser.map(s => `<button data-k="${esc(s.key)}" class="${s.off ? "off" : ""}"><i style="background:${s.color}"></i>${esc(s.name)}</button>`).join("");
  $("#whistLegend").querySelectorAll("button").forEach(b => b.onclick = () => { hid[b.dataset.k] = !hid[b.dataset.k]; drawFund(f); });
  const ev = f.events.filter(e => state.evtype === "all" || e.type === state.evtype);
  $("#evlist").innerHTML = feedRows(ev.slice(0, 40), false) + (ev.length > 40 ? `<p class="hint">Showing 40 of ${ev.length}.</p>` : "");
}

/* ---------- shell ---------- */
function route() { return (location.hash || "#overview").slice(1); }
function render() {
  if (!D) return;
  const r = route(), f = D.funds.find(x => x.slug === r);
  $("#tabs").innerHTML = `<a href="#overview" class="${!f ? "on" : ""}">Overview</a>` + D.funds.map(x => `<a href="#${x.slug}" class="${f === x ? "on" : ""}">${x.code}<small>${pct(x.nav_returns.d1, 1)}</small></a>`).join("");
  if (f) { $("#view").innerHTML = viewFund(f); document.title = f.code + " · EasyETFs Tracker"; drawFund(f); drawTable(f);
    $("#q").oninput = e => { state.table.q = e.target.value; drawTable(f); };
    $("#kind").value = state.table.kind; $("#kind").onchange = e => { state.table.kind = e.target.value; drawTable(f); };
    $("#evseg").onclick = e => { const b = e.target.closest("button"); if (!b) return; state.evtype = b.dataset.ev; $("#evseg").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); drawFund(f); };
  } else { $("#view").innerHTML = viewOverview(); document.title = "EasyETFs Tracker"; drawOverview(); }
  $("#view").querySelectorAll("[data-range]").forEach(b => b.onclick = () => { state.range = b.dataset.range; const y = scrollY; render(); scrollTo(0, y); });
}
function redraw() { if (!D) return; const f = D.funds.find(x => x.slug === route()); f ? (drawFund(f), drawTable(f)) : drawOverview(); }
async function init() {
  try { D = await (await fetch("data.json?" + Date.now())).json(); } catch (e) { $("#view").innerHTML = `<div class="err">Couldn't load data.json.</div>`; return; }
  const gen = D.generated_at_utc, stale = (Date.now() - new Date(gen)) > 3 * 864e5;
  $("#fresh").innerHTML = `<span class="dot ${stale ? "stale" : ""}"></span>Updated ${ago(gen)} · ${new Date(gen).toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" })}`;
  $("#foot").innerHTML = `Data: EasyETFs daily PCF holdings files, EasyEquities published NAV and JSE closing prices (Yahoo Finance), captured by a scheduled GitHub Action. Premium/discount compares the latest published NAV with the most recent market close, so timing differences between the two add noise. Stock moves come from Yahoo Finance. Informational only — not investment advice.`;
  window.addEventListener("hashchange", () => { scrollTo(0, 0); render(); });
  let t; window.addEventListener("resize", () => { clearTimeout(t); t = setTimeout(redraw, 120); });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
  render();
}
init();
</script>
